# ==========================================
# CareerCompass AI - Render Blueprint Spec
# Deploy Backend + Frontend + MySQL Database
# ==========================================

services:
  # 1. Spring Boot Backend Web Service (Dockerized Java 21)
  - type: web
    name: careercompass-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DB_HOST
        fromDatabase:
          name: careercompass-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: careercompass-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: careercompass-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: careercompass-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: careercompass-db
          property: password
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ALLOWED_ORIGINS
        value: "*"

  # 2. React Frontend Static Site
  - type: web
    name: careercompass-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    plan: free
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: careercompass-backend
          property: host
          suffix: /api
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  # Managed Cloud Database
  - name: careercompass-db
    databaseName: careercompass_db
    user: root
    plan: free
